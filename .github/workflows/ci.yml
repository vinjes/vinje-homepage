name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Selbstprüfung Zeitachse
        run: node scripts/check-timeline.ts

      - name: Build (Server, Node-Adapter)
        run: npm run build

      - name: Build (statisch, GitHub Pages)
        env:
          GITHUB_PAGES: "true"
        run: npm run build
